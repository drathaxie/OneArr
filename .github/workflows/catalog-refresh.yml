name: Refresh tracker catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
  push:
    branches:
      - feature/tracker-catalog
      - feature/native-torrentleech
    paths:
      - ".github/workflows/catalog-refresh.yml"
      - "tools/generate_tracker_catalog.py"

permissions:
  contents: write

concurrency:
  group: tracker-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild metadata-only manifest
        run: python tools/generate_tracker_catalog.py
      - name: Commit changed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/tracker-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh offline tracker metadata"
            git push origin HEAD:${{ github.ref_name }}
          fi
