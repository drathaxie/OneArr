name: tray-acceptance

# Runs the tray release flow on a disposable Windows runner: install, tray, sign-in in a browser, update, rollback,
# uninstall and purge. Never runs against a real OneArr installation. Updates are served from 127.0.0.1 only.
# Starts on a push to any acceptance/** branch (current-commit mode) or on manual dispatch.
#   mode = published       : tests a release already on GitHub (release_tag)
#   mode = current-commit  : builds the same artifacts from this commit as version 0.9.0 and tests those
#                            (use this before a release exists; the results say which mode was used)

on:
  push:
    branches: ['acceptance/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'published or current-commit'
        required: true
        default: 'current-commit'
        type: choice
        options: [published, current-commit]
      release_tag:
        description: 'Tag to test when mode is published, for example v0.3.0'
        required: false
        default: 'v0.2.0'

permissions:
  contents: read

jobs:
  tray-acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the published release exactly as a user would
        if: (inputs.mode || 'current-commit') == 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.2.0' }}
        run: |
          New-Item -ItemType Directory -Force -Path build/published | Out-Null
          gh release download $env:TAG --repo ${{ github.repository }} --dir build/published --pattern "*-win-x64.zip" --pattern "*-win-x64.zip.sha256"

      - name: Build the same artifacts from this commit (test version 0.9.0)
        if: (inputs.mode || 'current-commit') == 'current-commit'
        shell: pwsh
        run: |
          cd web; npm ci; npm run build; cd ..
          $v = "0.9.0"
          dotnet publish src/OneArr.Api/OneArr.Api.csproj -c Release -r win-x64 --self-contained true -p:Version=$v -p:DebugType=None -p:DebugSymbols=false -o build/stage/app
          Set-Content -NoNewline -Encoding ascii -Path build/stage/app/version.txt -Value $v
          dotnet publish src/OneArr.Tray/OneArr.Tray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$v -p:DebugType=None -p:DebugSymbols=false -o build/stage
          New-Item -ItemType Directory -Force -Path build/published | Out-Null
          $name = "OneArr-$v-win-x64"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("build/stage", "build/published/$name.zip", [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash -Algorithm SHA256 "build/published/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "build/published/$name.zip.sha256"

      - name: Run tray acceptance
        shell: pwsh
        env:
          MODE: ${{ inputs.mode || 'current-commit' }}
          TAG: ${{ inputs.release_tag || 'v0.2.0' }}
        run: |
          $version = if ($env:MODE -eq 'published') { $env:TAG -replace '^v', '' } else { '0.9.0' }
          $zip = Get-ChildItem build/published -Filter "OneArr-$version-win-x64.zip" | Select-Object -First 1
          $sha = Get-ChildItem build/published -Filter "OneArr-$version-win-x64.zip.sha256" | Select-Object -First 1
          if (-not $zip -or -not $sha) { throw "No $version artifact found for mode $env:MODE" }
          Write-Host "Testing mode=$env:MODE version=$version zip=$($zip.Name)"
          ./tools/windows/tray-acceptance.ps1 -ReleaseZip $zip.FullName -ReleaseSha256File $sha.FullName -ReleaseVersion $version -OutDir build/tray-acceptance

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-acceptance
          path: build/tray-acceptance
          if-no-files-found: ignore
