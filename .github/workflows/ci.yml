name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests that run on any OS
        run: dotnet test OneArr.slnx -c Release --filter "Platform!=Windows"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend build and tests
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - name: Backend tests (cross-platform)
        run: dotnet test OneArr.slnx -c Release --filter "Platform!=Windows"

      # Fails if no Windows test runs, so the Windows-only security tests cannot be silently skipped.
      - name: Backend tests (Windows filesystem regressions)
        run: dotnet test OneArr.slnx -c Release --filter "Platform=Windows"

      # Synthetic library on this runner, not a user library. Reports wall time, CPU time and allocations per phase.
      - name: Library benchmark on Windows (synthetic library)
        shell: pwsh
        env:
          ONEARR_BENCH: "1"
          ONEARR_BENCH_MOVIES: "20000"
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          dotnet test OneArr.slnx -c Release --filter "Category=Benchmark" --logger "console;verbosity=detailed" 2>&1 | Tee-Object -FilePath build/library-benchmark-windows.txt

      - name: Keep library benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-library-benchmark
          path: build/library-benchmark-windows.txt
          if-no-files-found: ignore

      - name: Publish release-shaped build
        shell: pwsh
        run: |
          dotnet publish src/OneArr.Api/OneArr.Api.csproj -c Release -r win-x64 --self-contained true -p:Version=0.0.0 -p:DebugType=None -p:DebugSymbols=false -o build/release/app
          "0.0.0" | Set-Content -NoNewline -Encoding ascii build/release/app/version.txt
          dotnet publish src/OneArr.Tray/OneArr.Tray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=0.0.0 -p:DebugType=None -p:DebugSymbols=false -o build/release

      - name: Acceptance run on Windows
        shell: pwsh
        run: ./tools/windows/acceptance.ps1 -ReleaseDir build/release -ExpectedVersion 0.0.0 -OutFile build/measurements.json

      - name: Keep measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-measurements
          path: build/measurements.json
          if-no-files-found: ignore
